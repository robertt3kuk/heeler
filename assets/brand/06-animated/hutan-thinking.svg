stroke-linecap="round"/></g><ellipse cx="270.5" cy="348.0" rx="105.8" ry="82" fill="#D99A7C"/><path d="M247.8 296.0 Q270.5 276.0 293.2 296.0 Q297.0 312.0 270.5 314.0 Q244.0 312.0 247.8 296.0 Z" fill="#B87458"/><ellipse cx="258.2" cy="303.0" rx="8" ry="6" fill="#3A1D14"/><ellipse cx="282.8" cy="303.0" rx="8" ry="6" fill="#3A1D14"/><path d="M234.6 370.0 Q270.5 374.0 308.3 366.0" fill="none" stroke="#7A3B27" stroke-width="8" stroke-linecap="round"/><g class="hand" transform="translate(10.0 0)"><ellipse cx="322" cy="438" rx="50" ry="38" fill="#8C4F36"/><path d="M290 418 Q300 404 314 414 M310 410 Q322 398 336 410 M332 412 Q344 402 356 416" fill="none" stroke="#6F3824" stroke-width="5" stroke-linecap="round"/></g><g class="bubble"><circle cx="388" cy="120" r="10" fill="#fff"/><circle cx="414" cy="86" r="16" fill="#fff"/><rect x="404" y="6" width="104" height="64" rx="32" fill="#fff"/><g fill="#17151A"><circle class="dot" cx="432" cy="38" r="7"/><circle class="dot" cx="456" cy="38" r="7"/><circle class="dot" cx="480" cy="38" r="7"/></g></g></g></g></svg>