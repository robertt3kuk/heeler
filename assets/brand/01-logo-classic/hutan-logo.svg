  <ellipse cx="309" cy="236" rx="24" ry="16" fill="#1A0F0C"/>
  <circle cx="211" cy="231" r="5" fill="#fff" opacity=".85"/>
  <circle cx="317" cy="231" r="5" fill="#fff" opacity=".85"/>
  <!-- sleepy lids -->
  <path d="M178 232 Q203 214 228 232" fill="none" stroke="#6F3824" stroke-width="5" stroke-linecap="round"/>
  <path d="M284 232 Q309 214 334 232" fill="none" stroke="#6F3824" stroke-width="5" stroke-linecap="round"/>

  <!-- muzzle -->
