  <circle cx="404" cy="420" r="58" fill="#17151A"/>
  <circle cx="404" cy="420" r="48" fill="#F5B53D"/>
  <path d="M386 404 L370 420 L386 436 M422 404 L438 420 L422 436 M410 398 L398 442" fill="none" stroke="#17151A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="530" y="300" font-family="SF Pro Rounded, Avenir Next, Helvetica, Arial, sans-serif" font-weight="800" font-size="190" fill="#F4EDE6" letter-spacing="-4">hutan</text>
  <text x="1094" y="300" font-family="Menlo, Monaco, monospace" font-weight="700" font-size="110" fill="#F5B53D">_</text>
  <text x="538" y="370" font-family="Menlo, Monaco, monospace" font-size="38" fill="#E0692E" letter-spacing="2">code from the canopy</text>
