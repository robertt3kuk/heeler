  <!-- ears -->
  <ellipse cx="108" cy="270" rx="30" ry="40" fill="#A55A3A"/>
  <ellipse cx="404" cy="270" rx="30" ry="40" fill="#A55A3A"/>
  <ellipse cx="112" cy="272" rx="14" ry="22" fill="#7E4029"/>
  <ellipse cx="400" cy="272" rx="14" ry="22" fill="#7E4029"/>

