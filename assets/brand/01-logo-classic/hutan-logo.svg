<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 512" width="1400" height="512">
  <rect width="1400" height="512" fill="#0F0E11"/>
  <g transform="translate(56 56) scale(0.78125)">
  <!-- background -->
  <rect width="512" height="512" rx="112" fill="#17151A"/>

  <!-- orange hair fringe -->
  <g fill="#E0692E">
    <circle cx="256" cy="262" r="186"/>
    <circle cx="96" cy="200" r="46"/>
    <circle cx="416" cy="200" r="46"/>
    <circle cx="82" cy="300" r="44"/>
    <circle cx="430" cy="300" r="44"/>
    <circle cx="120" cy="392" r="44"/>
    <circle cx="392" cy="392" r="44"/>
