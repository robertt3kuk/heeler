  <path d="M232 296 Q256 276 280 296 Q284 312 256 314 Q228 312 232 296 Z" fill="#B87458"/>
  <ellipse cx="243" cy="303" rx="8" ry="6" fill="#3A1D14"/>
  <ellipse cx="269" cy="303" rx="8" ry="6" fill="#3A1D14"/>

  <!-- smug smirk -->
  <path d="M196 362 Q250 392 318 356" fill="none" stroke="#7A3B27" stroke-width="8" stroke-linecap="round"/>

