[package]
name = "staffy-daemon"
description = "staffyd: Staffy daemon lifecycle, connection layer, event bus, request router, and terminal sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "staffy_daemon"

[[bin]]
name = "staffyd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
staffy-agents.workspace = true
staffy-core.workspace = true
staffy-gateway.workspace = true
staffy-index.workspace = true
staffy-protocol.workspace = true
staffy-storage.workspace = true
staffy-terminal.workspace = true
libc.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[dev-dependencies]
staffy-client.workspace = true
staffy-gateway = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
