[package]
name = "hutan-daemon"
description = "hutand: Hutan daemon lifecycle, connection layer, event bus, request router, and terminal sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hutan_daemon"

[[bin]]
name = "hutand"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
hutan-agents.workspace = true
hutan-core.workspace = true
hutan-gateway.workspace = true
hutan-index.workspace = true
hutan-protocol.workspace = true
hutan-storage.workspace = true
hutan-terminal.workspace = true
libc.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[dev-dependencies]
hutan-client.workspace = true
hutan-gateway = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
