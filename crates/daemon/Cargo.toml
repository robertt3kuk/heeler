[package]
name = "heeler-daemon"
description = "heelerd: Heeler daemon lifecycle, connection layer, event bus, request router, and terminal sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "heeler_daemon"

[[bin]]
name = "heelerd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
heeler-core.workspace = true
heeler-protocol.workspace = true
heeler-terminal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
heeler-client.workspace = true
libc.workspace = true
tempfile.workspace = true

[lints]
workspace = true
