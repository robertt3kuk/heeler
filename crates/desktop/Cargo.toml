[package]
name = "hutan-desktop"
description = "hutan-desktop: GPUI workbench (docks, pane tree, panels, palette, presets)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hutan_desktop"

[[bin]]
name = "hutan-desktop"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
hutan-chat-view.workspace = true
hutan-client.workspace = true
hutan-core.workspace = true
hutan-protocol.workspace = true
hutan-settings.workspace = true
hutan-terminal-view.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
hutan-agents.workspace = true
hutan-daemon.workspace = true
hutan-gateway = { workspace = true, features = ["test-support"] }
hutan-storage.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
