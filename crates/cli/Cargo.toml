[package]
name = "staffy-cli"
description = "staffy: command-line client for staffyd, and the host-terminal renderer used by attach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "staffy_cli"

[[bin]]
name = "staffy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
staffy-client.workspace = true
staffy-core.workspace = true
staffy-protocol.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time"] }
unicode-width.workspace = true

[dev-dependencies]
staffy-agents.workspace = true
staffy-daemon.workspace = true
staffy-gateway = { workspace = true, features = ["test-support"] }
parking_lot.workspace = true
portable-pty.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread"] }
vt100.workspace = true

[lints]
workspace = true
