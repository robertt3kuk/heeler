[package]
name = "heeler-cli"
description = "heeler: command-line client for heelerd, and the host-terminal renderer used by attach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "heeler_cli"

[[bin]]
name = "heeler"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
heeler-client.workspace = true
heeler-core.workspace = true
heeler-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
unicode-width.workspace = true

[dev-dependencies]
heeler-daemon.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread"] }
vt100.workspace = true

[lints]
workspace = true
