[graph]
all-features = true

[advisories]
yanked = "deny"
# Transitive dependencies of the pinned GPUI (ADR 0003); informational "unmaintained" notices
# with no safe upgrade. Revisit on every GPUI bump.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, pulled in by gpui" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, pulled in by gpui/fontdb" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, pulled in by gpui_wgpu/usvg" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0", # notify (file watcher); public-domain dedication
  "ISC",
  # File-level copyleft only: used unmodified by GPUI's font stack (cbindgen, dwrote, option-ext).
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# Workspace crates are `publish = false`; project license is an open question (status.md).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/zed-industries/zed",
  # Git dependencies of the pinned zed revision (ADR 0003).
  "https://github.com/zed-industries/font-kit",
  "https://github.com/proptest-rs/proptest",
]
