[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
hutan-agents = { path = "crates/agents" }
hutan-chat-view = { path = "crates/chat_view" }
hutan-client = { path = "crates/client" }
hutan-core = { path = "crates/core" }
hutan-daemon = { path = "crates/daemon" }
hutan-gateway = { path = "crates/gateway" }
hutan-index = { path = "crates/index" }
hutan-protocol = { path = "crates/protocol" }
hutan-settings = { path = "crates/settings" }
hutan-storage = { path = "crates/storage" }
hutan-terminal = { path = "crates/terminal" }
hutan-terminal-view = { path = "crates/terminal_view" }

anyhow = "1.0.104"
bitflags = { version = "2.13.2", features = ["serde"] }
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false }
futures = "0.3.34"
libc = "0.2.190"
notify = "8.2.0"
parking_lot = "0.12.5"
# Parses the bundle's property lists in the xtask bundle test (dev only).
plist = "1.10.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
regex = "1.13.1"
# HTTP for the model gateway (ADR 0008): rustls with the `ring` provider (installed by hutan-gateway,
# `rustls-no-provider`) and the platform verifier for roots; aws-lc is avoided for its OpenSSL license.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
# Renders the app icon from the brand SVG (`xtask icon`); no text, no system fonts.
resvg = { version = "0.46.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.3"
# macOS Keychain for provider credentials (ADR 0008).
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }
unicode-width = "0.2.2"
vt100 = "0.16.2"

# Pinned by ADR 0004 (terminal engine) and ADR 0003 (GPUI); used from M1/M2.
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "ef376006f32728b15e6a67706a04849cb781c812", default-features = false }
# Only for terminal_view's real-font shaping test (macOS text system without a window/main thread).
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "ef376006f32728b15e6a67706a04849cb781c812", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ef376006f32728b15e6a67706a04849cb781c812", default-features = false, features = ["font-kit", "runtime_shaders"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The VT engine and the terminal crate run in every debug-built daemon and desktop test; left
# unoptimized they are ~10x slower and the flood tests (20 MB through the engine) time out.
[profile.dev.package.alacritty_terminal]
opt-level = 3

[profile.dev.package.vte]
opt-level = 3

[profile.dev.package.hutan-terminal]
opt-level = 3
